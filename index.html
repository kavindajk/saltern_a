<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saltern AR Video Test</title>
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Script to play/pause video when the A4 drawing is found or lost by the camera -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector('#ar-target');
        const vid = document.querySelector('#saltern-vid');
        
        target.addEventListener("targetFound", event => {
          console.log("Target found!");
          vid.play();
        });
        target.addEventListener("targetLost", event => {
          console.log("Target lost!");
          vid.pause();
        });
      });
    </script>
  </head>
  
  <body>
    <!-- Set up the AR scene, pointing to your compiled targets.mind file -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Load your video here -->
        <video id="saltern-vid" src="./saltern_video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- The AR Entity: targetIndex 0 points to your first uploaded A4 drawing target -->
      <a-entity id="ar-target
